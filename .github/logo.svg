<svg xmlns="http://www.w3.org/2000/svg" width="338.86" height="417.12" viewBox="27.57 3.94 338.86 417.12">
  <!-- The ReFlux mark, the contours of design/logo/logo.svg of the app
       repository exactly: three rings at 1, 0.6 and 0.35 opacity around the
       core. Two things differ, both about the heading it stands in. The
       canvas is cropped to the ink and carries 31 units of air under it, so
       the mark fills the width it is given and sits a little above the
       middle of the line, which lets the word beside it ride lower. And the
       ink follows the reader's theme: without the icon's plate, a near
       white mark would be invisible on a white page. -->
  <style>
    .ink { stroke: #101820; }
    .core { fill: #101820; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #E8EEF3; }
      .core { fill: #E8EEF3; }
    }
  </style>
  <g class="ink" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="33.44">
      <path d="M320.70,92.08 L349.71,108.83 L349.71,285.17 L290.16,319.56"/>
      <path d="M226.02,356.59 L197.00,373.34 L44.29,285.17 L44.29,216.40"/>
      <path d="M44.29,142.34 L44.29,108.83 L197.00,20.66 L256.56,55.05"/>
    </g>
    <g stroke-width="24.32" stroke-opacity="0.6">
      <path d="M304.95,237.51 L304.95,259.33 L197.00,321.65 L156.52,298.28"/>
      <path d="M107.94,270.23 L89.05,259.33 L89.05,134.67 L129.53,111.30"/>
      <path d="M178.11,83.25 L197.00,72.35 L304.95,134.67 L304.95,181.42"/>
    </g>
    <g stroke-width="18.24" stroke-opacity="0.35">
      <path d="M255.19,151.55 L265.46,157.48 L265.46,236.52 L241.50,250.36"/>
      <path d="M207.27,270.12 L197.00,276.05 L128.54,236.52 L128.54,208.86"/>
