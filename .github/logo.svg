<svg xmlns="http://www.w3.org/2000/svg" width="339" height="386" viewBox="27.57 3.94 338.86 386.12">
  <!-- The ReFlux mark for the README headings, drawn to read small: one
       ring and the core, where design/logo/logo.svg of the app repository
       nests three rings at 1, 0.6 and 0.35 opacity. Below about a hundred
       pixels those merge into a haze. The canvas is cropped to the ink, so
       the mark fills whatever width it is given, and the colour follows the
       reader's theme - the plateless mark would be invisible on a white
       page otherwise. -->
  <style>
    .ring { stroke: #101820; }
    .core { fill: #101820; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #E8EEF3; }
      .core { fill: #E8EEF3; }
    }
  </style>
  <g class="ring" fill="none" stroke-width="33.44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320.70,92.08 L349.71,108.83 L349.71,285.17 L290.16,319.56"/>
    <path d="M226.02,356.59 L197.00,373.34 L44.29,285.17 L44.29,216.40"/>
    <path d="M44.29,142.34 L44.29,108.83 L197.00,20.66 L256.56,55.05"/>
  </g>
  <path class="core" d="M197.00,163.56 L225.96,180.28 L225.96,213.72 L197.00,230.44 L168.04,213.72 L168.04,180.28 Z"/>
</svg>
