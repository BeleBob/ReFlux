name: ReFlux release

# A reflux-v<version> tag builds the reflux manager for Linux and publishes
# it as a GitHub release with SHA256SUMS, the installer and the notes from
# docs/reflux/CHANGELOG.md. (Upstream's release.yml reacts to v* tags only,
# so the two never collide.) reflux-images.yml tags the images <version>
# and latest for the same tag; a release build uses the latest ones.
on:
  push:
    tags: ['reflux-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./cmd/reflux -count=1

      - name: Notes
        # The version's section of the changelog; no section, no release.
        run: |
          version="${GITHUB_REF_NAME#reflux-v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' docs/reflux/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "docs/reflux/CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat notes.md

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#reflux-v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.releaseVersion=$version -X main.imageTag=latest" \
              -o "dist/reflux-linux-$arch" ./cmd/reflux
          done
          test -f deploy/reflux/install.sh && cp deploy/reflux/install.sh dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
          "./reflux-linux-amd64" version

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ReFlux ${GITHUB_REF_NAME#reflux-v}" \
            --notes-file notes.md
